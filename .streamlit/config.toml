[theme]
primaryColor = "#1B3A6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4FF"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
# 禁用文件监听：避免 Streamlit 启动时扫描 .libs/transformers 数百个子模块
# （每个都尝试 import torchvision 失败，导致启动耗时 30-60 秒）
# 代价：改代码后不会自动热重载，需手动刷新浏览器（按 R）
fileWatcherType = "none"

[browser]
gatherUsageStats = false
