name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app tests scripts

      - name: Run tests
        env:
          # 单元测试不调用真实 API，仅需满足 pydantic-settings 必填校验
          ZHIPUAI_API_KEY: dummy-key
          LANGCHAIN_API_KEY: dummy-key
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: dummy-key
          TAVILY_API_KEY: dummy-key
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type-check & build
        run: npm run build
