version: "3.9"

services:
  # ── OmniRAG Application ───────────────────────────────────────
  omnirag:
    build:
      context: .
      target: runtime
    image: omnirag:latest
    container_name: omnirag_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-omnirag-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - omnirag_net

  # ── MCP Server (standalone) ───────────────────────────────────
  mcp_server:
    build:
      context: .
      target: runtime
    image: omnirag:latest
    container_name: omnirag_mcp
    env_file:
      - .env
    command: ["python", "-m", "app.mcp.server"]
    networks:
      - omnirag_net
    restart: unless-stopped

networks:
  omnirag_net:
    driver: bridge

volumes:
  omnirag_data:
